name: Build (no code signing)
env:
IL2CPP_ADDITIONAL_ARGS: '--compiler-flags="-fbracket-depth=2048"'
run:

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout (with LFS files)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry StumbleOffline.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StumbleOffline-ipa
          path: StumbleOffline.ipa
