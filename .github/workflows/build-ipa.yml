name: Build Unity iOS Unsigned IPA

on:
  push:
    branches:
      - main

jobs:
  build-unity-ios:
    name: Build Unity Project for iOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Unity License Activation
        uses: game-ci/unity-request-activation@v2
        with:
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
          serial: ${{ secrets.UNITY_SERIAL }} # Required if using Unity Pro

      - name: Build Unity Project (iOS)
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: iOS
          # Add custom build script method if needed via custom parameters

      - name: Build Xcode Project to Unsigned IPA
        run: |
          cd Build/iOS # Adjust to your Unity Xcode output path
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build.xcarchive

          xcodebuild -exportArchive \
            -archivePath build.xcarchive \
            -exportOptionsPlist ExportOptionsUnsigned.plist \
            -exportPath ./unsigned-ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: unsigned-ipa/*.ipa
